pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
        // Architectury Loom arrastra dependencias del ecosistema Forge que solo viven aca.
        maven {
            name = 'MinecraftForge'
            url = 'https://files.minecraftforge.net/maven/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'gravis-flying-config-menu'

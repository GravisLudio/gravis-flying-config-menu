# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = false

# Fabric / Minecraft. 26.2 FINAL (Mod Menu 20.0.3 exige >=26.2). Misma pila que Central Kitchen, que ya probo el cliente
# automatico en este PC.
minecraft_version = 26.2
minecraft_version_range = >=26.2- <26.3-
loader_version = 0.19.5
loom_version = 1.17.491
fabric_api_version = 0.156.0+26.2

# Mod. El id NO se puede cambiar despues de publicar: nombre e id son PROVISIONALES hasta que Gravis decida.
mod_id = create_fly_config_menu
mod_artifact_id = create-fly-config-menu
mod_name = Create Fly: Config Menu
mod_license = MIT
mod_version = 0.1.0
mod_group_id = com.gravisludio.flyconfigmenu
mod_authors = GravisLudio
mod_description = An in-game config screen for Create Fly and the addons that use its config system. Client-only.

# Dependencias. Create Fly solo se compila contra el (embebe Create, Flywheel, Ponder y Catnip).
create_fly_version = 26.2-6.0.9-2
create_version_range = >=6.0.9-1 <6.1.0
# Opcional en ejecucion: la integracion solo se carga si Mod Menu esta instalado.
modmenu_version = 20.0.3
